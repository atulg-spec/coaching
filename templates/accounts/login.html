<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Success Coaching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B00',
                        secondary: '#1A6B72',
                        dark: '#1C1B4B',
                    },
                    fontFamily: {
                        heading: ['"Yatra One"', 'cursive'],
                        body: ['Hind', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-t-4 border-t-primary">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-heading text-dark">Success Coaching</h1>
            <p class="text-gray-500 mt-2">Admin & Staff Portal</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 text-sm rounded bg-red-100 text-red-800">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700">Username</label>
                <input type="text" name="username" required class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-700">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-primary focus:border-primary outline-none">
            </div>
            <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded hover:bg-orange-600 transition">Log In</button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <a href="{% url 'home' %}" class="hover:text-primary">&larr; Back to Public Website</a>
        </div>
    </div>
</body>
</html>
