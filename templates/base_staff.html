<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Staff Portal — Success Coaching{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary:   '#243B53',
                        navy: {
                            DEFAULT: '#243B53',
                            dark:    '#102A43',
                            light:   '#334E68',
                        },
                        secondary: '#2A9D8F',
                        teal: {
                            DEFAULT: '#2A9D8F',
                            50:      '#F0FDFA',
                            100:     '#CCFBF1',
                            200:     '#99F6E4',
                            500:     '#2A9D8F',
                            600:     '#238276',
                            700:     '#1D6A60',
                            800:     '#154E47',
                        },
                        accent:    '#F4B942',
                        golden: {
                            DEFAULT: '#F4B942',
                            50:      '#FEF9EE',
                            100:     '#FDF2DC',
                            200:     '#FBE4B6',
                            500:     '#F4B942',
                            600:     '#D99A19',
                            700:     '#B87A0E',
                        },
                        light:     '#F5F7FA',
                        dark:      '#172B4D',
                        surface:   '#FFFFFF',
                        muted:     '#64748B',
                        border:    '#E2E8F0',
                        success:   '#16A34A',
                        warning:   '#D99A19',
                        danger:    '#DC5252',
                    },
                    fontFamily: {
                        heading: ['"Yatra One"', 'cursive'],
                        body:    ['Hind', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Hind', sans-serif; color: #172B4D; background-color: #F5F7FA; }
        .nav-link { @apply flex items-center gap-3 px-3 py-2 rounded text-slate-300 hover:bg-white/10 hover:text-white transition-all duration-150; }
        .nav-link.active { @apply bg-secondary text-white font-semibold shadow-md; }
    </style>
</head>
<body class="bg-light text-dark flex h-screen overflow-hidden">

    {% include 'dashboard/includes/alerts.html' %}
    {% include 'dashboard/includes/aside.html' %}

    <!-- Main content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
    
        {% include 'dashboard/includes/topnavbar.html' %} 

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-2 bg-light">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
