<!-- Floating AI Chatbot Widget -->
<div id="aiChatbotWidgetRoot" class="fixed bottom-5 right-5 z-50 font-sans">

    <!-- Floating Toggle Button -->
    <button 
        id="aiWidgetToggleBtn" 
        onclick="toggleAiWidget()"
        title="Chat with AI Tutor"
        class="w-14 h-14 bg-gradient-to-tr from-primary to-secondary text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all duration-200 border-2 border-white/80 focus:outline-none"
    >
        <span id="aiWidgetIconOpen" class="text-2xl">🤖</span>
        <span id="aiWidgetIconClose" class="hidden text-xl font-bold">✕</span>
        <!-- Pulse ring indicator -->
        <span class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-accent"></span>
        </span>
    </button>

    <!-- Floating Popover Chat Window -->
    <div 
        id="aiWidgetPopover" 
        class="hidden fixed bottom-20 right-5 w-[92vw] sm:w-[380px] h-[520px] bg-white rounded-2xl shadow-2xl border border-slate-200/90 flex flex-col overflow-hidden transition-all duration-300"
    >
        <!-- Widget Header -->
        <div class="px-4 py-3 bg-gradient-to-r from-primary to-navy text-white flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm font-bold">
                    🤖
                </div>
                <div>
                    <h4 class="text-xs font-bold leading-tight">Success Coaching AI</h4>
                    <p class="text-[10px] text-teal-200 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Online &bull; Cloudflare AI
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="toggleAiWidget()" class="text-white/80 hover:text-white p-1 rounded transition text-xs font-bold">
                    ✕
                </button>
            </div>
        </div>

        <!-- Widget Messages Container -->
        <div id="aiWidgetMessages" class="flex-1 overflow-y-auto p-3 space-y-3 bg-slate-50/50 text-xs">
            <div class="flex items-start gap-2">
                <div class="w-6 h-6 rounded-full bg-teal-100 text-secondary flex items-center justify-center text-[10px] font-bold shrink-0">
                    🤖
                </div>
                <div class="bg-white border border-slate-200/80 rounded-2xl rounded-tl-sm p-3 text-slate-700 leading-relaxed shadow-sm">
                    Hello! I'm the Success Coaching AI Assistant. How can I help you today with courses, admissions, or study questions?
                </div>
            </div>
        </div>

        <!-- Widget Typing Indicator -->
        <div id="aiWidgetTyping" class="hidden px-3 py-1 bg-slate-50/50 text-[10px] text-muted flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce [animation-delay:0.2s]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce [animation-delay:0.4s]"></span>
            <span>AI is responding...</span>
        </div>

        <!-- Widget Footer Input -->
        <div class="p-2.5 bg-white border-t border-slate-100">
            <form id="aiWidgetForm" onsubmit="handleWidgetSubmit(event)" class="flex items-center gap-1.5">
                <input 
                    type="text" 
                    id="aiWidgetInput" 
                    placeholder="Type a question..."
                    class="flex-1 px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-secondary focus:bg-white transition"
                />
                <button 
                    type="submit" 
                    id="aiWidgetBtnSend"
                    class="w-8 h-8 rounded-xl bg-secondary hover:bg-teal-600 text-white flex items-center justify-center text-xs font-semibold transition shrink-0 shadow-sm"
                >
                    ➤
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    let widgetConversationId = null;

    function toggleAiWidget() {
        const popover = document.getElementById('aiWidgetPopover');
        const iconOpen = document.getElementById('aiWidgetIconOpen');
        const iconClose = document.getElementById('aiWidgetIconClose');

        if (popover.classList.contains('hidden')) {
            popover.classList.remove('hidden');
            iconOpen.classList.add('hidden');
            iconClose.classList.remove('hidden');
            document.getElementById('aiWidgetInput').focus();
        } else {
            popover.classList.add('hidden');
            iconOpen.classList.remove('hidden');
            iconClose.classList.add('hidden');
        }
    }

    function appendWidgetMsg(role, text) {
        const msgs = document.getElementById('aiWidgetMessages');
        const isUser = role === 'user';

        const row = document.createElement('div');
        row.className = `flex items-start gap-2 ${isUser ? 'flex-row-reverse' : ''}`;

        const bubble = document.createElement('div');
        bubble.className = `p-2.5 rounded-2xl text-xs max-w-[80%] leading-relaxed ${
            isUser ? 'bg-secondary text-white rounded-tr-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-sm shadow-sm'
        }`;
        bubble.textContent = text;

        row.appendChild(bubble);
        msgs.appendChild(row);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function handleWidgetSubmit(e) {
        e.preventDefault();
        const input = document.getElementById('aiWidgetInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        appendWidgetMsg('user', text);

        const typing = document.getElementById('aiWidgetTyping');
        typing.classList.remove('hidden');

        // Extract CSRF cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetch('/chatbot/api/send/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken') || ''
            },
            body: JSON.stringify({
                conversation_id: widgetConversationId,
                message: text
            })
        })
        .then(res => res.json())
        .then(data => {
            typing.classList.add('hidden');
            if (data.success) {
                appendWidgetMsg('assistant', data.reply);
                if (data.conversation_id) widgetConversationId = data.conversation_id;
            } else {
                appendWidgetMsg('assistant', data.error || 'AI service currently unavailable.');
            }
        })
        .catch(err => {
            typing.classList.add('hidden');
            appendWidgetMsg('assistant', 'Network error reaching AI.');
        });
    }
</script>
