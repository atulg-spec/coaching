{% extends base_template %}
{% block page_title %}Collect Fee{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-xl font-bold text-dark mb-6">Fee Collection</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Select Student</label>
                <select name="student_id" class="w-full border border-gray-300 rounded p-3 focus:ring-primary focus:border-primary">
                    <option value="">-- Choose Student --</option>
                    {% for student in students %}
                    <option value="{{ student.id }}">{{ student.user.get_full_name }} (@{{ student.user.username }}) ({{ student.student_id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Amount Paid (₹)</label>
                    <input type="number" name="amount_paid" class="w-full border border-gray-300 rounded p-3 focus:ring-primary focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Payment Mode</label>
                    <select name="payment_mode" class="w-full border border-gray-300 rounded p-3 focus:ring-primary focus:border-primary">
                        <option value="cash">Cash</option>
                        <option value="upi">UPI</option>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="cheque">Cheque</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-[#102A43] text-white font-bold py-3 rounded transition shadow-md">Record Payment</button>
        </div>
    </form>
</div>

{% if open_receipt_ids %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        window.open("{% url 'combined_receipt' %}?tx_ids={{ open_receipt_ids }}", "_blank");
    });
</script>
{% endif %}

{% endblock %}
