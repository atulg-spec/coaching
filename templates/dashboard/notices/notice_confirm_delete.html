{% extends base_template %}
{% block page_title %}Delete Notice{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10">
    <div class="bg-white rounded-xl shadow-sm border border-red-100 overflow-hidden">
        <div class="bg-red-50 p-6 flex flex-col items-center text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-red-900 mb-2">Delete Notice?</h2>
            <p class="text-red-700">Are you sure you want to delete the notice <strong>"{{ notice.title }}"</strong>? This action cannot be undone.</p>
        </div>
        
        <div class="p-6 bg-white flex justify-center gap-4">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="bg-red-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-red-700 transition shadow-sm">Yes, Delete It</button>
            </form>
            <a href="{% url 'notice_list' %}" class="px-6 py-2.5 rounded-lg font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
