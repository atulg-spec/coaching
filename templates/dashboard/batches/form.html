{% extends base_template %}
{% load crispy_forms_tags %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-3 border-b border-gray-100 bg-gray-50">
            <h3 class="text-lg font-bold text-dark">Batch Details</h3>
        </div>
        <div class="p-8">
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-8 flex justify-end gap-4 border-t border-gray-100 pt-6">
                    <a href="{% url 'batch_list' %}" class="px-6 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 font-medium transition">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-primary text-white rounded font-medium hover:bg-[#102A43] transition shadow-sm">Save Batch</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
