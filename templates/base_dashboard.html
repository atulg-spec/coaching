<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard — Success Coaching{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary:   '#FF6B00',
                        secondary: '#1A6B72',
                        accent:    '#F5C518',
                        light:     '#FFF8F0',
                        dark:      '#1C1B4B',
                    },
                    fontFamily: {
                        heading: ['"Yatra One"', 'cursive'],
                        body:    ['Hind', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Hind', sans-serif; }
        .nav-link { @apply flex items-center gap-3 px-3 py-2 rounded text-gray-300 hover:bg-white/10 hover:text-white transition-all duration-150; }
        .nav-link.active { @apply bg-primary text-white font-semibold shadow-md; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    {% include 'dashboard/includes/alerts.html' %}
    {% include 'dashboard/includes/aside.html' %}

    <!-- Main content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
    
        {% include 'dashboard/includes/topnavbar.html' %} 

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-2 bg-gray-50">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
